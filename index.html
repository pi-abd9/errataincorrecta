<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Errata incorrecta</title>
<style>
body {
background-color: #ffffff;
margin: 0;
font-family: "Georgia", "Times New Roman", serif;
cursor: pointer;
overflow: hidden;
}
.wrapper {
position: relative;
width: 100vw;
height: 100vh;
box-sizing: border-box;
}
/* 1. TITLE CONTAINER */
.title-container {
font-size: 3rem;
font-weight: normal;
color: #000000;
letter-spacing: 1px;
text-align: center;
position: absolute;
left: 50%;
transform: translate(-50%, -50%);
width: 100%;
max-width: 600px;
transition: top 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s cubic-bezier(0.25, 1, 0.5, 1);
}
/* STATE 1: Default home position (Absolute Center) */
body.state-1 .title-container {
top: 50%;
opacity: 1;
}
.cursor {
display: inline-block;
width: 3px;
height: 3.5rem;
background-color: #000000;
margin-left: 5px;
animation: blink 1s step-end infinite;
vertical-align: middle;
}
@keyframes blink {
from, to { background-color: transparent }
50% { background-color: #000000; }
}
/* 2. MANIFESTO CONTAINER */
.info-loop {
max-width: 600px;
width: 90%;
font-size: 1.1rem;
line-height: 1.8;
color: #222222;
opacity: 0;
text-align: left;
position: absolute;
top: 40%;
left: 50%;
transform: translate(-50%, 0);
pointer-events: none;
transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
}
.info-loop p {
margin-bottom: 24px;
}
/* ==========================================================================
CHOREOGRAPHY TIMELINE (THE ANIMATIONS)
========================================================================== */
/* FIRST CLICK STAGE A: Instant Wipeout into White Void */
body.stage-wipeout .title-container,
body.stage-wipeout .info-loop {
opacity: 0 !important;
transition: none !important;
}
/* FIRST CLICK STAGE B & C: The Asynchronous Rebuild at Top 26% */
body.stage-reveal-all .title-container {
top: 26%;
opacity: 0;
animation: slowFadeIn 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
body.stage-reveal-all .info-loop {
animation: slowFadeIn 1.4s cubic-bezier(0.25, 1, 0.5, 1) 1.2s forwards;
}
@keyframes slowFadeIn {
to {
opacity: 1;
pointer-events: auto;
}
}
/* SECOND CLICK RESET: Complete, instant screen blackout */
body.stage-reset-wipeout .title-container,
body.stage-reset-wipeout .info-loop {
opacity: 0 !important;
transition: none !important;
}
/* THE INTERACTION SHIELD */
body.animating {
pointer-events: none !important;
cursor: default !important;
}
</style>
</head>
<body class="state-1">
<div class="wrapper" id="portal-wrapper">
<div class="title-container">
Errata incorrecta<span class="cursor"></span>
</div>
<!-- THE RE-CALIBRATED INTERACTIVE MANIFESTO -->
<div class="info-loop">
<p>You have entered the digital and acoustic space of an art project.</p>
<p>A single text scattered in the city, awaiting physical recovery.</p>
<p style="margin-top: 36px;"><em>More information to follow...</em></p>
</div>
</div>
<script>
const body = document.body;
let audioCtx = null;
let masterGain = null;
let activeVoices = [];
let sequenceIntervals = [];

const baseScale = [87.31, 98.00, 110.00, 123.47, 130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 349.23];

function generateDuchampHat() {
    let hat = [];
    for (let i = 0; i < 25; i++) {
        hat.push(baseScale[i % baseScale.length]);
    }
    for (let i = hat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [hat[i], hat[j]] = [hat[j], hat[i]];
    }
    return hat;
}

// EXPERIMENT 2 CONFIGURATION: THE PHASE-SHIFTING "ERRATA" CANON
let globalSharedHat = []; 

function createVoiceLine(speedMs, startingOffset) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    const voiceGain = audioCtx.createGain();
    voiceGain.gain.setValueAtTime(0.03, audioCtx.currentTime); // Blends delayed copies cleanly
    
    let cardIndex = startingOffset; // Staggers where each "errata copy" begins reading the array
    
    osc.frequency.setValueAtTime(globalSharedHat[cardIndex % 25], audioCtx.currentTime);
    osc.connect(voiceGain);
    voiceGain.connect(masterGain);
    osc.start();
    activeVoices.push(osc);

    const interval = setInterval(() => {
        cardIndex++;
        const nextFreq = globalSharedHat[cardIndex % 25];
        osc.frequency.exponentialRampToValueAtTime(nextFreq, audioCtx.currentTime + 0.8);
    }, speedMs);
    sequenceIntervals.push(interval);
}

function startDuchampChoir() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // Resume context if suspended by browser security policy
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
    
    // Pure single sequence generation for the whole choir
    globalSharedHat = generateDuchampHat(); 
    
    // The master voice alongside two drifting, delayed system error copies (the errata)
    createVoiceLine(2000, 0);  // Master Voice 
    createVoiceLine(2040, 5);  // First Errata: Delayed by 5 notes, drifting slightly slower
    createVoiceLine(2080, 10); // Second Errata: Delayed by 10 notes, drifting even slower
}

function stopDuchampChoir() {
    // 1. Clear all active beat timers instantly
    sequenceIntervals.forEach(interval => clearInterval(interval));
    sequenceIntervals = [];
    
    if (masterGain && audioCtx) {
        // 2. Exponentially fade out to smooth over unwanted audio clicks
        masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
        
        // Capture a local reference to voices to shut down after the fade out completes
        const voicesToStop = [...activeVoices];
        activeVoices = []; // Reset storage instantly so next click can begin empty
        
        setTimeout(() => {
            voicesToStop.forEach(osc => { 
                try { 
                    osc.stop(); 
                    osc.disconnect(); 
                } catch(e) {} 
            });
            if (masterGain) { 
                try { masterGain.disconnect(); } catch(e) {}
            }
            masterGain = null;
        }, 650);
    }
}

body.addEventListener('click', function(e) {
    if (e.target.tagName === 'A') return;
    if (body.classList.contains('state-1')) {
        body.classList.remove('state-1');
        body.classList.add('stage-wipeout', 'animating');
        setTimeout(() => {
            body.classList.remove('stage-wipeout');
            body.classList.add('stage-reveal-all');
            startDuchampChoir();
            setTimeout(() => { body.classList.remove('animating'); }, 2600);
        }, 1000);
    } else if (body.classList.contains('stage-reveal-all')) {
        body.classList.remove('stage-reveal-all');
        body.classList.add('stage-reset-wipeout', 'animating');
        stopDuchampChoir();
        setTimeout(() => {
            body.classList.remove('stage-reset-wipeout');
            const title = document.querySelector('.title-container');
            title.style.transition = 'none';
            body.classList.add('state-1');
            title.style.opacity = '0';
            setTimeout(() => {
                title.style.transition = 'top 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.4s ease-in-out';
                title.style.opacity = '1';
                setTimeout(() => { body.classList.remove('animating'); }, 1400);
            }, 50);
        }, 800);
    }
});
</script>
</body>
</html>
