<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Errata incorrecta</title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            font-family: "Georgia", "Times New Roman", serif;
            cursor: pointer;
            overflow: hidden;
        }
        
        .wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        .title-container {
            font-size: 3rem;
            font-weight: normal;
            color: #000000;
            letter-spacing: 1px;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            transition: top 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.state-1 .title-container {
            top: 50%;
            opacity: 1;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 3.5rem;
            background-color: #000000;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #000000; }
        }

        .info-loop {
            max-width: 600px;
            width: 90%;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #222222;
            opacity: 0;
            text-align: left;
            position: absolute;
            top: 40%; 
            left: 50%;
            transform: translate(-50%, 0);
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .info-loop p {
            margin-bottom: 24px;
        }

        body.stage-wipeout .title-container,
        body.stage-wipeout .info-loop {
            opacity: 0 !important;
            transition: none !important;
        }

        body.stage-reveal-all .title-container {
            top: 26%; 
            opacity: 0;
            animation: slowFadeIn 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        body.stage-reveal-all .info-loop {
            animation: slowFadeIn 1.4s cubic-bezier(0.25, 1, 0.5, 1) 1.2s forwards;
        }

        @keyframes slowFadeIn {
            to {
                opacity: 1;
                pointer-events: auto;
            }
        }

        body.stage-reset-wipeout .title-container,
        body.stage-reset-wipeout .info-loop {
            opacity: 0 !important;
            transition: none !important;
        }

        body.animating {
            pointer-events: none !important;
            cursor: default !important;
        }
    </style>
</head>
<body class="state-1">

    <div class="wrapper" id="portal-wrapper">
        <div class="title-container">
            Errata incorrecta<span class="cursor"></span>
        </div>
        
        <div class="info-loop">
            <p>You have entered the digital and acoustic space of an art project.</p>
            <p>A single text scattered in the city, awaiting physical recovery.</p>
            <p style="margin-top: 36px;"><em>More information to follow...</em></p>
        </div>
    </div>

    <script>
        const body = document.body;
        let audioCtx = null;
        let masterGain = null;
        let activeVoices = []; 
        let sequenceIntervals = []; 

        // THE FIXED ARCHIVAL SCALE POOL
        const baseScale = [87.31, 98.00, 110.00, 123.47, 130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 349.23];
        
        // GLOBAL ARCHIVE DATA LAYER
        let masterHat = [];
        let masterCardIndex = 0;

        // THE UNIFIED 75-CARD DECK SHARED BY ALL THREE VOICES
        function generateUnifiedMasterHat() {
            let hat = [];
            // Fill a singular hat with 75 notes (3 perfect iterations of the 25 notes)
            for (let i = 0; i < 75; i++) {
                hat.push(baseScale[i % baseScale.length]);
            }
            // Shuffle the complete 75-card master archive
            for (let i = hat.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [hat[i], hat[j]] = [hat[j], hat[i]];
            }
            return hat;
        }

        // Draw a card dynamically from the single, shared, non-repeating archive pool
        function drawNextMasterCard() {
            if (masterCardIndex >= masterHat.length) {
                masterHat = generateUnifiedMasterHat(); // Completely replenish and reshuffle when empty
                masterCardIndex = 0;
            }
            const note = masterHat[masterCardIndex];
            masterCardIndex++;
            return note;
        }

        function createVoiceLine(speedMs) {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            
            const voiceGain = audioCtx.createGain();
            voiceGain.gain.setValueAtTime(0.04, audioCtx.currentTime); 
            
            // All voices pull their starting notes from the same unified deck index
            osc.frequency.setValueAtTime(drawNextMasterCard(), audioCtx.currentTime);
            
            osc.connect(voiceGain);
            voiceGain.connect(masterGain);
            osc.start();
            activeVoices.push(osc);

            // Independent timer loops draw from the SAME card pool, shattering the planar harmony
            const interval = setInterval(() => {
                const nextFreq = drawNextMasterCard();
                osc.frequency.exponentialRampToValueAtTime(nextFreq, audioCtx.currentTime + 0.6);
            }, speedMs);
            
            sequenceIntervals.push(interval);
        }

        function startDuchampChoir() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.12, audioCtx.currentTime); 
            masterGain.connect(audioCtx.destination);

            // Generate the shared 75-card pool fresh upon interaction
            masterHat = generateUnifiedMasterHat();
            masterCardIndex = 0;

            createVoiceLine(1800); // Yvonne
            createVoiceLine(2400); // Magdeleine
            createVoiceLine(3000); // Marcel
        }

        function stopDuchampChoir() {
            sequenceIntervals.forEach(interval => clearInterval(interval));
            sequenceIntervals = [];

            if (masterGain && audioCtx) {
                masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
                setTimeout(() => {
                    activeVoices.forEach(osc => { try { osc.stop(); osc.disconnect(); } catch(e) {} });
                    if (masterGain) { masterGain.disconnect(); }
                    activeVoices = [];
                    masterGain = null;
                }, 600);
            }
        }

        body.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') return;
            
            if (body.classList.contains('state-1')) {
                body.classList.remove('state-1');
                body.classList.add('stage-wipeout', 'animating');
                
                setTimeout(() => {
                    body.classList.remove('stage-wipeout');
                    body.classList.add('stage-reveal-all'); 
                    
                    startDuchampChoir(); 
                    
                    setTimeout(() => { body.classList.remove('animating'); }, 2600); 
                }, 1000); 
            } 
            else if (body.classList.contains('stage-reveal-all')) {
                body.classList.remove('stage-reveal-all');
                body.classList.add('stage-reset-wipeout', 'animating');
                
                stopDuchampChoir(); 
                
                setTimeout(() => {
                    body.classList.remove('stage-reset-wipeout');
                    const title = document.querySelector('.title-container');
                    title.style.transition = 'none';
                    body.classList.add('state-1'); 
                    title.style.opacity = '0';
                    
                    setTimeout(() => {
                        title.style.transition = 'top 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.4s ease-in-out';
                        title.style.opacity = '1';
                        setTimeout(() => { body.classList.remove('animating'); }, 1400); 
                    }, 50);
                }, 800); 
            }
        });
    </script>
</body>
</html>
